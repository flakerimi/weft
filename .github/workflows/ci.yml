name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The playground, the site and the benchmark's landing embed their builds,
      # so all three must exist before Go compiles. site.sh builds @weft/ui first.
      - run: scripts/playground.sh build
      - run: scripts/site.sh build
      - run: pnpm --filter weft-bench build
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Builds @weft/themes and @weft/ui first: the page build tests read their CSS from dist/.
      - run: pnpm test
      - run: pnpm build
